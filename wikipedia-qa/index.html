<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Wikipedia Android Alpha — QA Assessment | Lisa Langlois</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#182337;background:#f7f9fc}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 15%,#e8effc,#f7f9fc 55%)}
.access{width:min(100%,430px);text-align:center;padding:46px 32px 42px;border-radius:22px;border:1px solid #e0e7f1;background:#fff;box-shadow:0 12px 50px #152c5510}
.access h1{font-size:clamp(24px,4vw,29px);line-height:1.2;letter-spacing:-.045em;margin:0 0 10px;font-weight:740}
.author{font-size:15px;color:#64748b;margin:0 0 36px}
.entry{width:100%;display:flex;border:1px solid #b7c5d8;border-radius:12px;padding:4px;background:#fff;transition:box-shadow .16s,border-color .16s}
.entry:focus-within{border-color:#4778c7;box-shadow:0 0 0 3px #4778c719}
.entry input{flex:1;min-width:0;padding:12px;border:0;outline:0;font:inherit;font-size:15px;color:#182337;background:transparent}
.entry input::placeholder{color:#8593a7}
.entry button{height:45px;width:47px;background:#1f4f9c;border:0;border-radius:9px;color:white;font-size:24px;cursor:pointer;display:grid;place-items:center}
.entry button:hover{background:#123e86}
.entry button:disabled{opacity:.6;cursor:wait}
.error{min-height:20px;font-size:13px;color:#b42318;text-align:left;margin:11px 2px 0}
.error:empty{visibility:hidden}
#loading{color:#64748b;font-size:13px;margin:10px 0 0;display:none}
.entry:has(button:disabled)+#loading{display:block}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.access[hidden],#viewer[hidden]{display:none!important}
#viewer{width:100vw;height:100dvh;display:block;border:0}
@media(max-width:460px){.access{padding:38px 22px 30px}}
</style>
</head>
<body>
<section class="access" id="auth">
<h1>Wikipedia Android Alpha</h1>
<p class="author">Lisa Langlois</p>
<form id="form" autocomplete="off">
<label class="sr-only" for="pass">Mot de passe</label>
<div class="entry"><input type="password" id="pass" placeholder="Mot de passe" autocomplete="off" required autofocus><button id="unlock" type="submit" aria-label="Ouvrir le rapport" title="Ouvrir le rapport">→</button></div>
<p id="loading" role="status">Ouverture du rapport…</p>
<p class="error" id="error" role="alert"></p>
</form>
</section>
<iframe id="viewer" title="Wikipedia QA Assessment" sandbox="allow-downloads" referrerpolicy="no-referrer" hidden></iframe>
<script>
const ITERATIONS=650000;
const SALT=Uint8Array.from(atob('IlEG3cYZHxqO2DMWl2EvHg=='),c=>c.charCodeAt(0));
const IV=Uint8Array.from(atob('aZMJ7qRpnsN696AY'),c=>c.charCodeAt(0));
const CONTEXT=new TextEncoder().encode('wikipedia-qa-report-v1');
const form=document.getElementById('form');
form.addEventListener('submit',async event=>{
 event.preventDefault();
 const input=document.getElementById('pass'),button=document.getElementById('unlock'),error=document.getElementById('error');
 let pass=input.value.trim();
 input.value='';button.disabled=true;error.textContent='';
 try {
  if(!crypto?.subtle || typeof DecompressionStream==='undefined')throw new Error('Ce navigateur ne permet pas le déchiffrement du rapport.');
  const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  pass='';
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:SALT,iterations:ITERATIONS},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const response=await fetch('report.enc?v='+Array.from(IV,b=>b.toString(16).padStart(2,'0')).join(''),{cache:'reload'});
  if(!response.ok)throw new Error('Impossible de charger le rapport chiffré.');
  const ciphertext=await response.arrayBuffer();
  const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:IV,additionalData:CONTEXT},key,ciphertext);
  const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  const frame=document.getElementById('viewer');
  frame.srcdoc=html;document.getElementById('auth').hidden=true;frame.hidden=false;
  document.body.style.display='block';document.body.style.background='white';
 } catch(e){
  error.textContent=e.name==='OperationError'?'Mot de passe incorrect, ou page à actualiser.':(e.message||'Déchiffrement impossible.');
 }finally{pass='';button.disabled=false;}
});
</script>
</body>
</html>
